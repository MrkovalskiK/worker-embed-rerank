[project]
name = "worker"
version = "0.1.0"
description = "RunPod serverless worker with vLLM"
requires-python = ">=3.11"
dependencies = [
    "runpod>=1.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "vllm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
